spring:
  application:
    name: users
  jta:
    enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderly}
    username: ${SPRING_DATASOURCE_USERNAME:orderly}
    password: ${SPRING_DATASOURCE_PASSWORD:orderly}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that the mapping matches it.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Adopts an already existing dev database (baselines it at V1 instead of failing).
    # Use `false` for a clean production database.
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
---
orderly:
  internal:
    # No default on purpose: the service must not start without a shared secret.
    token: ${ORDERLY_INTERNAL_TOKEN}
---
springdoc:
  swagger-ui:
      path: "/api/swagger-ui"
      csrf:
        enabled: true
